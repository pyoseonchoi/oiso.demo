name: Deploy Backend

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  FASTAPI_IMAGE: ghcr.io/knu-mapin/backend-fastapi
  LANGGRAPH_IMAGE: ghcr.io/knu-mapin/backend-langgraph

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: |
          echo "image_tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push FastAPI
        uses: docker/build-push-action@v6
        with:
          context: .
          file: fastapi_server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.FASTAPI_IMAGE }}:${{ steps.meta.outputs.image_tag }}
            ${{ env.FASTAPI_IMAGE }}:main

      - name: Install LangGraph CLI
        run: |
          python -m pip install --upgrade pip
          pip install langgraph-cli

      - name: Build and push LangGraph
        working-directory: langgraph_server
        run: |
          langgraph build \
            --platform linux/amd64 \
            -t ${{ env.LANGGRAPH_IMAGE }}:${{ steps.meta.outputs.image_tag }}

          docker tag \
            ${{ env.LANGGRAPH_IMAGE }}:${{ steps.meta.outputs.image_tag }} \
            ${{ env.LANGGRAPH_IMAGE }}:main

          docker push ${{ env.LANGGRAPH_IMAGE }}:${{ steps.meta.outputs.image_tag }}
          docker push ${{ env.LANGGRAPH_IMAGE }}:main

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            cd /srv/mapin

            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u knu-mapin --password-stdin

            IMAGE_TAG=${{ steps.meta.outputs.image_tag }} docker compose -f docker-compose.app.yml pull

            IMAGE_TAG=${{ steps.meta.outputs.image_tag }} docker compose -f docker-compose.app.yml up -d

            docker image prune -f

            sleep 10

            curl -fsS http://127.0.0.1:8000/health
            curl -fsS http://127.0.0.1:8000/ready
