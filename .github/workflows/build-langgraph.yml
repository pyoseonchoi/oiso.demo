name: Build LangGraph Image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: knu-mapin/backend-langgraph

jobs:
  build-langgraph:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tags
        id: meta
        run: |
          echo "sha_tag=${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "branch_tag=${REGISTRY}/${IMAGE_NAME}:main" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install LangGraph CLI
        run: |
          python -m pip install --upgrade pip
          pip install langgraph-cli

      - name: Build LangGraph image
        working-directory: langgraph_server
        run: |
          langgraph build \
            --platform linux/amd64 \
            -t ${{ steps.meta.outputs.sha_tag }}

          docker tag \
            ${{ steps.meta.outputs.sha_tag }} \
            ${{ steps.meta.outputs.branch_tag }}

      - name: Push LangGraph image
        run: |
          docker push ${{ steps.meta.outputs.sha_tag }}
          docker push ${{ steps.meta.outputs.branch_tag }}
